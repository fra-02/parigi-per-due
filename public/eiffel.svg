<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#skyGrad)"/>
  
  <!-- Subtle Stars / Snowflakes -->
  <circle cx="100" cy="120" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="410" cy="90" r="5" fill="#fde047" opacity="0.9"/>
  <circle cx="140" cy="240" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="390" cy="280" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="80" cy="380" r="3" fill="#fde047" opacity="0.6"/>

  <!-- Romantic Heart glowing behind tower top -->
  <path d="M256 120 C220 70 160 80 160 130 C160 180 256 240 256 240 C256 240 352 180 352 130 C352 80 292 70 256 120 Z" fill="url(#heartGrad)" opacity="0.9" />

  <!-- Eiffel Tower Silhouette Stylized -->
  <!-- Spire -->
  <line x1="256" y1="110" x2="256" y2="180" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="105" r="7" fill="#fef08a"/>
  
  <!-- Top Dome -->
  <path d="M246 180 L266 180 L262 230 L250 230 Z" fill="url(#goldGrad)"/>
  <!-- Middle Tier -->
  <rect x="236" y="230" width="40" height="10" rx="3" fill="#fef08a"/>
  <path d="M244 240 L220 330 L292 330 L268 240 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <rect x="206" y="330" width="100" height="14" rx="4" fill="#fef08a"/>
  
  <!-- Bottom Legs and Arch -->
  <path d="M214 344 L170 450 L204 450 L230 380 Q256 360 282 380 L308 450 L342 450 L298 344 Z" fill="url(#goldGrad)"/>
  
  <!-- Golden lights & beams -->
  <circle cx="256" cy="180" r="5" fill="#ffffff"/>
  <circle cx="240" cy="285" r="4" fill="#ffffff"/>
  <circle cx="272" cy="285" r="4" fill="#ffffff"/>
  <circle cx="216" cy="390" r="4" fill="#ffffff"/>
  <circle cx="296" cy="390" r="4" fill="#ffffff"/>
</svg>
